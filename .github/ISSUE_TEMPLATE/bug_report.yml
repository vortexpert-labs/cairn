name: Bug report
description: Report a bug or unexpected behaviour in Cairn
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please verify the issue against the latest version and ensure it can be reproduced.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Commands or steps to reproduce the issue.
      placeholder: |
        1. cairn init
        2. cairn new ...
        3. cairn check
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What you expected to happen.
    validations:
      required: true
  - type: input
    id: cairn-version
    attributes:
      label: Cairn version
      description: Run `cairn --version` (or `node bin/cairn.js --version`).
      placeholder: "1.0.0-rc.1"
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Run `node --version`.
      placeholder: "v22.0.0"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating System and Architecture
      description: E.g., macOS Sequoia 15.7 (x86_64), Ubuntu 24.04 (arm64), Windows 11.
      placeholder: "macOS 15.7 (x86_64)"
    validations:
      required: true
  - type: textarea
    id: doctor-output
    attributes:
      label: Output of `cairn doctor`
      description: Paste the full output of running `cairn doctor` in your repository.
      render: shell
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or terminal output
      description: Any error traces, check output, or additional context.
      render: shell
