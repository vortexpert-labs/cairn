name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 18 reached end of life in April 2025 and is deliberately not supported.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  self-check:
    name: Cairn checks its own anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The immutability and transition checks compare against git history.
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
      - run: node bin/cairn.js check --strict --allow-verify
      - run: node bin/cairn.js doctor
      - name: Generated adapters are current
        run: node bin/cairn.js adapters

  example:
    name: The worked example is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
      # Documentation that does not run is documentation that rots.
      - run: node ../../bin/cairn.js check --allow-verify
        working-directory: examples/ledger-service
      - run: node ../../bin/cairn.js why src/ledger
        working-directory: examples/ledger-service

  benchmarks:
    name: Free benchmark tiers
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
      - name: Install benchmark dependencies
        run: npm ci
        working-directory: benchmarks
      - name: Run token footprint benchmark
        run: npm run tokens
        working-directory: benchmarks
      - name: Run deontic retrieval benchmark
        run: npm run deontic
        working-directory: benchmarks
