name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Node 18 reached end of life in April 2025 and is deliberately not supported.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  self-check:
    name: Cairn checks its own anchors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The immutability and transition checks compare against git history.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node bin/cairn.js check --strict
      - run: node bin/cairn.js doctor
