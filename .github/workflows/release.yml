name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Publish package and create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The immutability and transition checks compare against git history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing (OIDC) requires npm CLI 11.5.1 or newer.
      - name: Upgrade npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@latest

      - name: Run test suite
        run: node --test

      - name: Validate anchors
        run: node bin/cairn.js check --strict

      # Trusted Publishing uses GitHub OIDC token exchange (via permissions.id-token: write)
      # with npm registry. No NODE_AUTH_TOKEN secret is needed, and provenance is
      # generated automatically without --provenance.
      - name: Publish to npm
        run: npm publish

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
