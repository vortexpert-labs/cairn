name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write
  contents: write

jobs:
  release:
    name: Publish package and create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The immutability and transition checks compare against git history.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      # npm Trusted Publishing (OIDC) requires npm CLI 11.5.1 or newer.
      - name: Upgrade npm CLI for OIDC Trusted Publishing
        run: npm install -g npm@latest

      # A tag that disagrees with the manifest would publish the wrong version
      # under the right release notes, which is worse than failing here.
      - name: Tag matches package.json
        run: |
          manifest="v$(node -p "require('./package.json').version")"
          if [ "$manifest" != "${{ github.ref_name }}" ]; then
            echo "tag ${{ github.ref_name }} does not match package.json ($manifest)" >&2
            exit 1
          fi

      - name: Run test suite
        run: node --test

      - name: Validate anchors
        run: node bin/cairn.js check --strict

      # Trusted Publishing uses GitHub OIDC token exchange (via permissions.id-token: write)
      # with npm registry. No NODE_AUTH_TOKEN secret is needed, and provenance is
      # generated automatically without --provenance.
      # A prerelease must not take the `latest` dist-tag, or `npm install
      # @vortexpert-labs/cairn` would hand everyone a release candidate.
      - name: Publish to npm
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) npm publish --tag rc ;;
            *)   npm publish ;;
          esac

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./package.json').version")
          case "$version" in
            *-*) gh release create "${{ github.ref_name }}" --generate-notes --prerelease ;;
            *)   gh release create "${{ github.ref_name }}" --generate-notes ;;
          esac
